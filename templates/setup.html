<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>初期設定 - Toxov</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 36px;
      width: 100%;
      max-width: 360px;
    }
    h1 { font-size: 1.4rem; margin-bottom: 8px; }
    p  { font-size: 0.85rem; color: #888; margin-bottom: 24px; }
    label { display: block; font-size: 0.85rem; color: #888; margin-bottom: 6px; }
    input {
      width: 100%;
      background: #252525;
      border: 1px solid #333;
      border-radius: 8px;
      color: #e0e0e0;
      font-size: 0.95rem;
      padding: 10px 12px;
      outline: none;
      margin-bottom: 16px;
    }
    input:focus { border-color: #4dabf7; }
    button {
      width: 100%;
      padding: 12px;
      background: #4dabf7;
      color: #000;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { opacity: 0.85; }
    .error {
      background: #3a1a1a;
      border: 1px solid #5a2a2a;
      color: #ff6b6b;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 16px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>初期設定</h1>
    <p>管理者アカウントを作成してください</p>
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    <form method="post">
      <label>ユーザー名</label>
      <input type="text" name="username" autofocus required>
      <label>パスワード</label>
      <input type="password" name="password" required>
      <button type="submit">アカウントを作成</button>
    </form>
  </div>
</body>
</html>
