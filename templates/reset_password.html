{% extends "base_auth.html" %}
{% block title %}{{ t.reset_title }} - Toxov{% endblock %}
{% block content %}
<h1 class="title">{{ t.reset_title }}</h1>
{% if error %}<div class="err">{{ error }}</div>{% endif %}
{% if expired %}
  <a href="/forgot-password" class="link" style="margin-top:8px;">{{ t.resend_reset }}</a>
{% else %}
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>{{ t.reset_title }} <span style="color:var(--dim); font-size:.76rem;">{{ t.new_password_hint }}</span></label>
    <input type="password" name="password" autofocus required minlength="6" maxlength="200">
    <button type="submit" class="submit">{{ t.btn_change_password }}</button>
  </form>
  <a href="/login" class="link" style="margin-top:14px;">{{ t.link_login }}</a>
{% endif %}
{% endblock %}
