{% extends "base_auth.html" %}
{% block title %}新しいパスワード - Toxov{% endblock %}
{% block content %}
<h1 class="title">新しいパスワード</h1>
{% if error %}<div class="err">{{ error }}</div>{% endif %}
{% if expired %}
  <a href="/forgot-password" class="link" style="margin-top:8px;">もう一度リセットリンクを送る</a>
{% else %}
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>新しいパスワード <span style="color:var(--dim); font-size:.76rem;">（6文字以上）</span></label>
    <input type="password" name="password" autofocus required minlength="6" maxlength="200">
    <button type="submit" class="submit">パスワードを変更</button>
  </form>
  <a href="/login" class="link" style="margin-top:14px;">ログインに戻る</a>
{% endif %}
{% endblock %}
