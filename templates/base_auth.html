<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Toxov{% endblock %}</title>
  <style>
    :root {
      --bg:      #0d0d0d;
      --bg-card: #141414;
      --bg-in:   #1c1c1c;
      --border:  #242424;
      --text:    #e4e4e4;
      --muted:   #767676;
      --dim:     #3e3e3e;
      --accent:  #4dabf7;
      --success: #51cf66;
      --danger:  #ff6b6b;
      --r:       10px;
      --rs:      7px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      padding: 24px 16px;
    }
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 36px 32px;
      width: 100%;
      max-width: 380px;
    }
    .title { font-size: 1.3rem; font-weight: 700; margin-bottom: 24px; letter-spacing: -.3px; }
    label {
      display: block;
      font-size: .8rem;
      color: var(--muted);
      margin-bottom: 5px;
      margin-top: 14px;
    }
    label:first-of-type { margin-top: 0; }
    input {
      width: 100%;
      background: var(--bg-in);
      border: 1px solid var(--border);
      border-radius: var(--rs);
      color: var(--text);
      font-size: .9rem;
      padding: 9px 12px;
      outline: none;
      transition: border-color .15s;
      font-family: inherit;
    }
    input:focus { border-color: var(--accent); }
    .submit {
      width: 100%;
      margin-top: 20px;
      padding: 11px;
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: var(--rs);
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s;
      font-family: inherit;
    }
    .submit:hover { opacity: .85; }
    .link {
      display: block;
      text-align: center;
      color: var(--muted);
      font-size: .82rem;
      text-decoration: none;
      margin-top: 12px;
      transition: color .12s;
    }
    .link:hover { color: var(--text); }
    .link-sm { color: var(--dim); font-size: .78rem; }
    .err {
      background: #200d0d;
      border: 1px solid #3d1c1c;
      color: var(--danger);
      border-radius: var(--rs);
      padding: 9px 12px;
      margin-bottom: 16px;
      font-size: .84rem;
    }
    .ok {
      background: #0d2018;
      border: 1px solid #1c3d28;
      color: var(--success);
      border-radius: var(--rs);
      padding: 12px 14px;
      font-size: .84rem;
      line-height: 1.6;
    }
    {% block extra_style %}{% endblock %}
  </style>
</head>
<body>
  <div class="card">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
