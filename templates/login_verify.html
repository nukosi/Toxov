{% extends "base_auth.html" %}
{% block title %}{{ t.verify_title }} - Toxov{% endblock %}
{% block content %}
<h1 class="title">{{ t.verify_title }}</h1>
<p style="color:var(--muted);font-size:.88rem;text-align:center;margin-bottom:20px;">
  {{ t.verify_desc }}<br>{{ t.verify_expires }}
</p>
{% if error %}<div class="err">{{ error }}</div>{% endif %}
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>{{ t.verify_code }}</label>
  <input type="text" name="code" autofocus required maxlength="6"
         inputmode="numeric" pattern="[0-9]{6}" placeholder="000000"
         style="text-align:center;letter-spacing:8px;font-size:1.4rem;">
  <button type="submit" class="submit">{{ t.btn_verify }}</button>
</form>
<a href="/login" class="link link-sm">{{ t.link_login }}</a>
{% endblock %}
