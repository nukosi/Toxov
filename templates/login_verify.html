{% extends "base_auth.html" %}
{% block title %}2段階認証 - Toxov{% endblock %}
{% block content %}
<h1 class="title">認証コードを入力</h1>
<p style="color:var(--muted);font-size:.88rem;text-align:center;margin-bottom:20px;">
  登録メールアドレスに6桁のコードを送信しました。<br>有効期限は10分です。
</p>
{% if error %}<div class="err">{{ error }}</div>{% endif %}
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>認証コード</label>
  <input type="text" name="code" autofocus required maxlength="6"
         inputmode="numeric" pattern="[0-9]{6}" placeholder="000000"
         style="text-align:center;letter-spacing:8px;font-size:1.4rem;">
  <button type="submit" class="submit">確認</button>
</form>
<a href="/login" class="link link-sm">ログインに戻る</a>
{% endblock %}
