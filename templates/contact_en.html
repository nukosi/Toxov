<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Toxov</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0B0B0C;
      color: #F4F4F5;
      font-size: 14px;
      line-height: 1.9;
      padding: 48px 16px;
    }
    .container { max-width: 560px; margin: 0 auto; }
    h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: 8px; color: #fff; }
    .sub { font-size: .85rem; color: #8A8A93; margin-bottom: 36px; }
    label { display: block; font-size: .82rem; color: #8A8A93; margin-bottom: 6px; }
    input, textarea {
      width: 100%;
      background: #1a1a1a;
      border: 1px solid #2e2e2e;
      border-radius: 8px;
      color: #F4F4F5;
      font-size: 14px;
      padding: 10px 14px;
      margin-bottom: 20px;
      outline: none;
      transition: border-color .15s;
    }
    input:focus, textarea:focus { border-color: #555; }
    textarea { resize: vertical; min-height: 140px; line-height: 1.7; }
    button {
      background: #F97316;
      color: #000;
      border: none;
      border-radius: 8px;
      font-size: .9rem;
      font-weight: 700;
      padding: 11px 28px;
      cursor: pointer;
      transition: opacity .15s;
    }
    button:hover { opacity: .85; }
    .success {
      background: #0f2e1a;
      border: 1px solid #1a5c33;
      border-radius: 8px;
      padding: 16px 20px;
      color: #4ade80;
      margin-bottom: 24px;
    }
    .error {
      background: #2e0f0f;
      border: 1px solid #5c1a1a;
      border-radius: 8px;
      padding: 16px 20px;
      color: #f87171;
      margin-bottom: 24px;
    }
    a { color: #F97316; text-decoration: none; }
    .back { display: inline-block; color: #8A8A93; font-size: .82rem; margin-bottom: 32px; text-decoration: none; }
    .back:hover { color: #F4F4F5; }
    .opt { color: #555; font-size: .78rem; margin-left: 4px; }
  </style>
</head>
<body>
  <div class="container">
    <a href="/en" class="back">← Back to Toxov</a>
    <h1>Contact</h1>
    <p class="sub">Have a question or feedback? Send us a message and we'll get back to you within 2–3 business days.</p>

    {% if sent %}
    <div class="success">Message sent! Thank you for reaching out. We'll get back to you soon.</div>
    {% elif error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    {% if not sent %}
    <form method="post">
      <label>Name <span class="opt">(optional)</span></label>
      <input type="text" name="name" maxlength="100" value="{{ name or '' }}">

      <label>Email <span style="color:#f87171">*</span></label>
      <input type="email" name="email" required maxlength="200" value="{{ email or '' }}">

      <label>Message <span style="color:#f87171">*</span></label>
      <textarea name="message" required maxlength="3000">{{ message or '' }}</textarea>

      <button type="submit">Send message</button>
    </form>
    {% endif %}
  </div>
</body>
</html>
