{% extends "base_auth.html" %}
{% block title %}パスワードリセット - Toxov{% endblock %}
{% block content %}
<h1 class="title">パスワードリセット</h1>
{% if sent %}
  <div class="ok">
    登録済みのメールアドレスにリセットリンクを送信しました。<br>
    メールが届かない場合、メールアドレスが登録されていない可能性があります。
  </div>
  <a href="/login" class="link" style="margin-top:20px;">ログインに戻る</a>
{% else %}
  <p style="font-size:.84rem; color:var(--muted); margin-bottom:20px; line-height:1.6;">
    登録したメールアドレスを入力してください。パスワードリセットのリンクをお送りします。
  </p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>メールアドレス</label>
    <input type="email" name="email" autofocus required maxlength="200">
    <button type="submit" class="submit">リセットリンクを送信</button>
  </form>
  <a href="/login" class="link" style="margin-top:14px;">ログインに戻る</a>
{% endif %}
{% endblock %}
