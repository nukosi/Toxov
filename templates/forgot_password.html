{% extends "base_auth.html" %}
{% block title %}{{ t.forgot_title }} - Toxov{% endblock %}
{% block content %}
<h1 class="title">{{ t.forgot_title }}</h1>
{% if sent %}
  <div class="ok">
    {{ t.reset_sent }}
  </div>
  <a href="/login" class="link" style="margin-top:20px;">{{ t.link_login }}</a>
{% else %}
  <p style="font-size:.84rem; color:var(--muted); margin-bottom:20px; line-height:1.6;">
    {{ t.reset_desc }}
  </p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>{{ t.email }}</label>
    <input type="email" name="email" autofocus required maxlength="200">
    <button type="submit" class="submit">{{ t.btn_send_reset }}</button>
  </form>
  <a href="/login" class="link" style="margin-top:14px;">{{ t.link_login }}</a>
{% endif %}
{% endblock %}
