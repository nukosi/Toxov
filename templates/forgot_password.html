<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>パスワードリセット - Toxov</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 36px;
      width: 100%;
      max-width: 360px;
    }
    h1 { font-size: 1.4rem; margin-bottom: 8px; }
    p.desc { color: #888; font-size: 0.9rem; margin-bottom: 24px; line-height: 1.5; }
    label { display: block; font-size: 0.85rem; color: #888; margin-bottom: 6px; }
    input {
      width: 100%;
      background: #252525;
      border: 1px solid #333;
      border-radius: 8px;
      color: #e0e0e0;
      font-size: 0.95rem;
      padding: 10px 12px;
      outline: none;
      margin-bottom: 16px;
    }
    input:focus { border-color: #4dabf7; }
    button {
      width: 100%;
      padding: 12px;
      background: #4dabf7;
      color: #000;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 12px;
    }
    button:hover { opacity: 0.85; }
    a { display: block; text-align: center; color: #555; font-size: 0.85rem; text-decoration: none; }
    a:hover { color: #e0e0e0; }
    .success {
      background: #1a3a2a;
      border: 1px solid #2a5a3a;
      color: #6bcf9f;
      border-radius: 8px;
      padding: 14px 16px;
      font-size: 0.9rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>パスワードリセット</h1>
    {% if sent %}
      <div class="success" style="margin-top:16px">
        登録済みのメールアドレスにリセットリンクを送信しました。<br>
        メールが届かない場合、メールアドレスが登録されていない可能性があります。
      </div>
      <a href="/login" style="margin-top:20px">ログインに戻る</a>
    {% else %}
      <p class="desc">登録したメールアドレスを入力してください。パスワードリセットのリンクをお送りします。</p>
      <form method="post">
        <label>メールアドレス</label>
        <input type="email" name="email" autofocus required>
        <button type="submit">リセットリンクを送信</button>
      </form>
      <a href="/login">ログインに戻る</a>
    {% endif %}
  </div>
</body>
</html>
